# >>> coverage roots
# Auto-generated from the 2026-11-18 boot coverage capture (clean call landings).
# These are analysis roots; rename them as the functions are identified.
func Coverage_02_EDE8_V10 ede8 entry_mx:1,0
func Coverage_02_F59D_V11 f59d entry_mx:1,1
func Coverage_02_F835_V00 f835 entry_mx:0,0
func Coverage_02_F8D9_V11 f8d9 entry_mx:1,1

# $02:B0B6 snaps $024E up to the next tier ($10/$20/$30/$40, capped at
# $40), sets bit 4 of $022F and waits one frame via JSL $009397. It returns
# with RTS at $B0F9; $B0FA starts the next routine (a 16-bit counter/RNG
# using DP $42/$43).
# The routine is M1-only. Without the explicit boundary and the pinned call
# variants, v2_regen auto-promotes a phantom M0X1 clone from a wrong-width
# caller; that clone shifts the immediate operands and runs past max_insns.
func Clamp_024E_TierWait b0b6 end:b0fa entry_mx:1,1
force_variant_at 02B0B0 1 1
force_variant_at 02BD87 1 1

# $02:AFF9 begins with PHP and its RTL paths at $B1A7/$B1AB restore with
# PLP; PLX restores X. The routine therefore returns with the caller's
# entry width.
exit_mx_variant 02AFF9 0 0 0 0
exit_mx_variant 02AFF9 0 1 0 1
exit_mx_variant 02AFF9 1 0 1 0
exit_mx_variant 02AFF9 1 1 1 1

# $02:AFB6 returns M1X0. $02:B10E JSLs $02:DC53, the menu state machine;
# the handler returns through the dispatcher, so this is a normal JSL call.
exit_mx_variant 02AFB6 0 0 0 0
exit_mx_variant 02AFB6 1 0 1 0

# $02:DC74 dispatches through the 15-entry word table at $DC35, indexed by X.
# Entry 16 ($8B08) is padding/BRK, not a handler.
indirect_dispatch 2dc74 15 idx:X tables:dc35

# $02:ED4C is the sound-command tail dispatch: X = (cmd & $1F) * 2,
# then `JMP ($0000)` through the 16-bit word table at $ED4F.
# 17 entries: $ED71,$ED78,...,$EDE1. Slots beyond command 16 are not
# sound targets and take the interpreter fallback via the OOB path.
indirect_dispatch 2ed4c 17 idx:X tables:ed4f
